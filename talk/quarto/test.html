<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aharonov–Bohm — test</title>
<style>
  html,body { margin:0; padding:0; background:#000; color:#cfd6e4; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  #wrap { width:min(1000px, 94vw); font-size:28px; }
</style>
</head>
<body>
<div id="wrap">
<!-- BEGIN FRAGMENT (paste this block into the Quarto slide) -->
<div id="ab-root" style="width:100%;max-width:1000px;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;">
  <canvas id="ab-canvas" style="display:block;width:100%;background:#000;border-radius:6px;"></canvas>
  <div id="ab-ctl" style="display:flex;align-items:center;gap:0.6em;margin-top:0.5em;color:#cfd6e4;font-size:0.55em;">
    <span style="white-space:nowrap;">&Phi;/&Phi;<sub>0</sub></span>
    <input id="ab-phi" type="range" min="0" max="3" step="0.005" value="0"
           style="flex:1 1 auto;accent-color:#ff9a2e;cursor:pointer;">
    <span id="ab-phi-val" style="min-width:4.5em;text-align:right;color:#ff9a2e;">0.000</span>
  </div>
</div>
<script>
(function () {
  'use strict';

  /* =====================================================================
     PHYSICS CONTRACT — do not "fix" these by eye. Visual tuning happens in
     CFG only; the four statements below are the content of the animation.

     (1) SAME WAVENUMBER IN BOTH ARMS.  B = 0 and E = 0 everywhere the
         electrons actually travel, so no force acts, momentum is unchanged
         and the de Broglie wavelength is IDENTICAL in the two arms.  Both
         arms are drawn with the one constant CFG.lambda / K below.  The
         upper arm must never look "tighter" than the lower one: that would
         depict an energy exchange that does not happen, and it is the most
         common way to get this figure wrong.  The only difference between
         the arms is a PHASE.

     (2) deltaPhi = 2*pi * Phi/Phi_0.  For display it is split symmetrically
         (symmetric gauge): the upper arm accumulates +deltaPhi/2 and the
         lower -deltaPhi/2, ramped linearly with arc length along the path.
         Only the value at recombination is gauge invariant / observable;
         the ramp is a gauge-dependent bookkeeping device, not a change of
         momentum -- which is exactly why K is still shared (see (1)).

     (3) VECTOR POTENTIAL.  Outside the solenoid A is purely azimuthal with
         |A| proportional to 1/r, and curl A = B = 0 there.  Arrowhead size
         and field-line opacity therefore scale as 1/r: that decay IS the
         visual claim that A is nonzero where B vanishes.

     (4) SCREEN INTENSITY.  I(y) = cos^2( pi*(y - yc)/S + deltaPhi/2 ).
         Maxima sit at y = yc + S*(m - Phi/Phi_0), so raising Phi by one
         flux quantum translates the pattern by exactly one fringe spacing.
         RIGID TRANSLATION: the envelope never changes shape or amplitude.
     ===================================================================== */

  var CFG = {
    // ---- virtual design space; every coordinate below lives in these units
    VW: 1000,            // design width  (canvas is scaled to fit its box)
    VH: 520,             // design height

    // ---- interferometer geometry -------------------------------------
    xSplit: 120,         // x of the beam splitter
    xMirror: 460,        // x of both mirrors (and of the solenoid)
    xRecomb: 800,        // x of the recombination splitter
    yAxis: 250,          // optical axis (y of splitter / recombiner)
    armSep: 150,         // vertical offset of each mirror from the axis
    xSource: 30,         // where the input beam starts
    opticLen: 46,        // length of the grey 45 deg optic rectangles
    opticThick: 7,       // thickness of the same

    // ---- the waves ----------------------------------------------------
    lambda: 34,          // DISPLAY wavelength, in design units. ONE value:
                         // both arms use it. See physics note (1).
    amp: 13,             // transverse amplitude of the drawn sine
    ds: 3,               // arc-length sampling step when stroking a wave
    waveSpeed: 0.5,      // wavelengths per second the crests travel (visual
                         // only; unrelated to the electron's real velocity).
                         // SAMPLING GUARD: the phase advance per frame is
                         // omega*16.7 ms and must stay well below pi, so keep
                         // waveSpeed under roughly 15 wavelengths/second.
                         // Above that the wave aliases -- it looks frantic and
                         // its apparent direction of travel is meaningless --
                         // no matter how reasonable the number looks here.
    waveDir: +1,         // +1: crests travel splitter -> screen. -1 reverses.

    // ---- solenoid ------------------------------------------------------
    solR: 26,            // solenoid radius
    solDots: 7,          // flux-out-of-plane dots inside it

    // ---- vector potential field lines ---------------------------------
    aR0: 40,             // radius of the innermost A circle
    aGrow: 1.42,         // ratio between successive A circle radii
    aRmax: 150,          // largest A circle
    aRefR: 40,           // reference radius for the 1/r scaling
    aArrow: 11,          // arrowhead length at r = aRefR (scales as 1/r)
    aOpacity: 0.95,      // opacity at r = aRefR (scales as 1/r)
    aLabelX: 930,        // "A" label, top-right corner (= VW - 70)
    aLabelY: 55,         // baseline of the glyph; the arrow sits above it
    aLabelSize: 36,      // glyph size in px; the arrow scales with it

    // ---- detection screen ---------------------------------------------
    xScreen: 850,        // left edge of the accumulation band
    screenW: 46,         // width of the band the dots scatter across
    screenHalf: 170,     // half-height of the illuminated region
    fringeS: 34,         // fringe spacing S in eq. (4)
    maxDots: 2600,       // ring buffer size; oldest dots are recycled
    dotsPerFrame: 5,     // accumulation rate
    dotR: 1.5,           // dot radius
    cdfBins: 512,        // resolution of the precomputed inverse CDF

    // ---- colours -------------------------------------------------------
    cBeam: '#3dff9b',    // electron wave
    cGuide: 'rgba(60,255,155,0.18)', // faint path guide under the wave
    cOptic: '#8c93a0',   // splitters and mirrors
    cSol: '#ff9a2e',     // solenoid rim
    cSolFill: '#2a1a06', // solenoid interior
    cA: '#ff4d5e',       // vector potential
    cDot: 'rgba(150,255,200,0.92)', // screen dots
    cRef: 'rgba(120,170,255,0.55)', // dashed Phi = 0 reference maxima
    cText: '#cfd6e4',
    cPlate: '#5a6070'    // the screen plate itself
  };

  try {
    var root = document.getElementById('ab-root');
    var cv = document.getElementById('ab-canvas');
    var slider = document.getElementById('ab-phi');
    var readout = document.getElementById('ab-phi-val');
    if (!cv || !cv.getContext) return;              // fail silently
    var ctx = cv.getContext('2d');
    if (!ctx) return;

    var TAU = Math.PI * 2;
    var K = TAU / CFG.lambda;        // the ONE wavenumber -- physics note (1)
    // ONE angular frequency, in rad per millisecond, shared by the input beam,
    // both arms and the output beam.  Drawing time is ELAPSED ms (see loop()),
    // never the raw rAF timestamp.
    var OMEGA = TAU * CFG.waveSpeed / 1000;
    var phiRatio = 0;                // Phi / Phi_0
    var dPhi = 0;                    // deltaPhi = 2*pi*Phi/Phi_0
    var cssW = 0, dpr = 1, scale = 1;

    /* ---------- arm paths: splitter -> mirror -> recombiner ----------- */
    function makeArm(sign) {          // sign = -1 upper (smaller y), +1 lower
      var pts = [
        { x: CFG.xSplit,  y: CFG.yAxis },
        { x: CFG.xMirror, y: CFG.yAxis + sign * CFG.armSep },
        { x: CFG.xRecomb, y: CFG.yAxis }
      ];
      var cum = [0], total = 0, i;
      for (i = 1; i < pts.length; i++) {
        total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
        cum.push(total);
      }
      return { pts: pts, cum: cum, len: total, sign: sign };
    }
    var armUp = makeArm(-1), armDn = makeArm(1);

    function atArc(arm, s) {          // point + unit normal at arc length s
      var i = 1;
      while (i < arm.cum.length - 1 && s > arm.cum[i]) i++;
      var a = arm.pts[i - 1], b = arm.pts[i];
      var segL = arm.cum[i] - arm.cum[i - 1];
      var t = segL > 0 ? (s - arm.cum[i - 1]) / segL : 0;
      var dx = (b.x - a.x) / segL, dy = (b.y - a.y) / segL;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, nx: -dy, ny: dx };
    }

    /* ---------- inverse CDF of I(y), recomputed only when Phi moves ---- */
    var cdf = new Float64Array(CFG.cdfBins + 1);
    var y0 = CFG.yAxis - CFG.screenHalf, y1 = CFG.yAxis + CFG.screenHalf;

    function intensity(y) {           // physics note (4)
      var c = Math.cos(Math.PI * (y - CFG.yAxis) / CFG.fringeS + dPhi / 2);
      return c * c;
    }
    function buildCDF() {
      var acc = 0, i, y;
      cdf[0] = 0;
      for (i = 1; i <= CFG.cdfBins; i++) {
        y = y0 + (y1 - y0) * (i - 0.5) / CFG.cdfBins;
        acc += intensity(y);
        cdf[i] = acc;
      }
      for (i = 1; i <= CFG.cdfBins; i++) cdf[i] /= acc;
    }
    function sampleY() {              // inverse-CDF sampling, binary search
      var u = Math.random(), lo = 0, hi = CFG.cdfBins, mid;
      while (lo < hi) { mid = (lo + hi) >> 1; if (cdf[mid] < u) lo = mid + 1; else hi = mid; }
      return y0 + (y1 - y0) * (lo - Math.random()) / CFG.cdfBins;
    }

    /* ---------- dot ring buffer --------------------------------------- */
    var dx_ = new Float32Array(CFG.maxDots), dy_ = new Float32Array(CFG.maxDots);
    var dotN = 0, dotHead = 0;
    function addDot() {
      dx_[dotHead] = CFG.xScreen + Math.random() * CFG.screenW;
      dy_[dotHead] = sampleY();
      dotHead = (dotHead + 1) % CFG.maxDots;
      if (dotN < CFG.maxDots) dotN++;
    }
    function resetDots() { dotN = 0; dotHead = 0; }

    /* ---------- optic orientation, derived from the geometry -----------
       A reflecting surface must bisect the incoming and outgoing rays:
       reflection about a surface at angle th maps direction al -> 2*th - al,
       so th = (al_in + al_out)/2.  The arms leave the axis at the arm tilt,
       NOT at 45 degrees, so nothing here may be hardcoded -- change armSep or
       any of the x positions and the optics stay aligned.  (Canvas y grows
       downward; the two rhombus-vertex mirrors come out horizontal.)         */
    var tiltIn = Math.atan2(CFG.armSep, CFG.xMirror - CFG.xSplit);   // splitter side
    var tiltOut = Math.atan2(CFG.armSep, CFG.xRecomb - CFG.xMirror); // recombiner side
    var thSplit = (0 + -tiltIn) / 2;      // in 0, out -tiltIn  (upper arm)
    var thMirror = 0;                     // in -tilt, out +tilt -> horizontal
    var thRecomb = (tiltOut + 0) / 2;     // in +tiltOut, out 0

    /* ================= drawing ======================================== */
    function optic(x, y, th) {        // grey bar, surface at angle th
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(th);
      ctx.fillStyle = CFG.cOptic;
      ctx.fillRect(-CFG.opticLen / 2, -CFG.opticThick / 2, CFG.opticLen, CFG.opticThick);
      ctx.restore();
    }

    function drawArm(arm, t) {
      var s, p, ph, off;
      ctx.strokeStyle = CFG.cGuide;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(arm.pts[0].x, arm.pts[0].y);
      for (var i = 1; i < arm.pts.length; i++) ctx.lineTo(arm.pts[i].x, arm.pts[i].y);
      ctx.stroke();

      ctx.strokeStyle = CFG.cBeam;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (s = 0; s <= arm.len; s += CFG.ds) {
        p = atArc(arm, s);
        // gauge phase ramps linearly with arc length to +/- dPhi/2 -- note (2)
        ph = arm.sign < 0 ? +dPhi / 2 * (s / arm.len) : -dPhi / 2 * (s / arm.len);
        // SAME K and SAME OMEGA for both arms -- note (1)
        off = CFG.amp * Math.sin(K * s - CFG.waveDir * OMEGA * t + ph);
        if (s === 0) ctx.moveTo(p.x + p.nx * off, p.y + p.ny * off);
        else ctx.lineTo(p.x + p.nx * off, p.y + p.ny * off);
      }
      ctx.stroke();
    }

    function drawInputAndOutput(t) {
      var s, off, x;
      var lin = CFG.xSplit - CFG.xSource;   // input run-up length
      // Input beam: same K, same OMEGA, same waveDir.  Its arc length is
      // measured so that it reaches phase 0 exactly at the splitter, which is
      // where the arms start from 0 -- otherwise there is a kink at s = 0.
      ctx.strokeStyle = CFG.cBeam; ctx.lineWidth = 2;
      ctx.beginPath();
      for (s = 0; s <= lin; s += CFG.ds) {
        off = CFG.amp * Math.sin(K * (s - lin) - CFG.waveDir * OMEGA * t);
        x = CFG.xSource + s;
        if (s === 0) ctx.moveTo(x, CFG.yAxis + off); else ctx.lineTo(x, CFG.yAxis + off);
      }
      ctx.stroke();

      // Recombined axial ray: amplitude ~ |cos(deltaPhi/2)|, the on-axis value
      // of eq. (4).  Same K, OMEGA and waveDir -- interference, not a frequency
      // shift.  Its arc length continues from armUp.len, and the two arms'
      // gauge ramps are +/-dPhi/2 there, so the mean phase is continuous.
      var a = CFG.amp * Math.abs(Math.cos(dPhi / 2));
      ctx.beginPath();
      for (s = 0; s <= CFG.xScreen - CFG.xRecomb; s += CFG.ds) {
        off = a * Math.sin(K * (armUp.len + s) - CFG.waveDir * OMEGA * t);
        x = CFG.xRecomb + s;
        if (s === 0) ctx.moveTo(x, CFG.yAxis + off); else ctx.lineTo(x, CFG.yAxis + off);
      }
      ctx.stroke();
    }

    function drawSolenoid() {
      var cx = CFG.xMirror, cy = CFG.yAxis, i, ang, r;
      ctx.fillStyle = CFG.cSolFill;
      ctx.beginPath(); ctx.arc(cx, cy, CFG.solR, 0, TAU); ctx.fill();
      ctx.strokeStyle = CFG.cSol; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = CFG.cSol;                       // flux out of the plane
      ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, TAU); ctx.fill();
      for (i = 0; i < CFG.solDots; i++) {
        ang = TAU * i / CFG.solDots;
        r = CFG.solR * 0.58;
        ctx.beginPath();
        ctx.arc(cx + r * Math.cos(ang), cy + r * Math.sin(ang), 2.0, 0, TAU);
        ctx.fill();
      }
    }

    function drawA() {
      var cx = CFG.xMirror, cy = CFG.yAxis, r, n, i, ang, op, len;
      for (r = CFG.aR0; r <= CFG.aRmax; r *= CFG.aGrow) {
        op = Math.min(1, CFG.aOpacity * CFG.aRefR / r);   // |A| ~ 1/r, note (3)
        len = CFG.aArrow * CFG.aRefR / r;
        ctx.strokeStyle = 'rgba(255,77,94,' + op.toFixed(3) + ')';
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();

        n = Math.max(6, Math.round(TAU * r / 62));
        ctx.fillStyle = 'rgba(255,77,94,' + op.toFixed(3) + ')';
        for (i = 0; i < n; i++) {
          ang = TAU * i / n + 0.25;
          var px = cx + r * Math.cos(ang), py = cy + r * Math.sin(ang);
          var tx = -Math.sin(ang), ty = Math.cos(ang);      // azimuthal
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(Math.atan2(ty, tx));
          ctx.beginPath();
          ctx.moveTo(len, 0); ctx.lineTo(-len * 0.55, len * 0.45);
          ctx.lineTo(-len * 0.55, -len * 0.45); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
    }

    // Vector-potential label: italic A with an arrow over it.  Full opacity --
    // the circles are attenuated by 1/r, the label is not.  Drawn from frame()
    // after everything else so it can never end up under a beam.
    function drawALabel() {
      var x = CFG.aLabelX, y = CFG.aLabelY, sz = CFG.aLabelSize;
      ctx.fillStyle = CFG.cA;
      ctx.strokeStyle = CFG.cA;
      ctx.font = 'italic bold ' + sz + 'px ui-monospace,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('A', x, y);

      var w = ctx.measureText('A').width;        // arrow spans the glyph
      var ay = y - sz * 0.88, x0 = x - w / 2, x1 = x + w / 2;
      var h = sz * 0.17;                         // arrowhead size
      ctx.lineWidth = Math.max(1.5, sz * 0.06);
      ctx.beginPath(); ctx.moveTo(x0, ay); ctx.lineTo(x1 - h * 0.6, ay); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, ay);
      ctx.lineTo(x1 - h, ay - h * 0.6);
      ctx.lineTo(x1 - h, ay + h * 0.6);
      ctx.closePath(); ctx.fill();
    }

    function drawScreen() {
      var i, m, y;
      ctx.fillStyle = CFG.cPlate;
      ctx.fillRect(CFG.xScreen + CFG.screenW, CFG.yAxis - CFG.screenHalf - 14, 5,
                   2 * CFG.screenHalf + 28);
      // dashed reference lines: maxima of the Phi = 0 pattern
      ctx.strokeStyle = CFG.cRef; ctx.lineWidth = 1;
      ctx.setLineDash([5, 6]);
      for (m = -Math.floor(CFG.screenHalf / CFG.fringeS); m <= Math.floor(CFG.screenHalf / CFG.fringeS); m++) {
        y = CFG.yAxis + m * CFG.fringeS;
        ctx.beginPath();
        ctx.moveTo(CFG.xRecomb - 20, y); ctx.lineTo(CFG.xScreen + CFG.screenW, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = CFG.cDot;
      for (i = 0; i < dotN; i++) {
        ctx.beginPath(); ctx.arc(dx_[i], dy_[i], CFG.dotR, 0, TAU); ctx.fill();
      }
    }

    function drawText() {
      ctx.fillStyle = CFG.cText;
      ctx.font = '15px ui-monospace,monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('Φ/Φ₀ = ' + phiRatio.toFixed(3), 30, CFG.VH - 54);
      ctx.fillText('Δφ  = ' + (dPhi / Math.PI).toFixed(3) + ' π', 30, CFG.VH - 32);
      ctx.fillText('shift = ' + phiRatio.toFixed(3) + ' fringe' + (Math.abs(phiRatio - 1) < 5e-4 ? '' : 's'),
                   30, CFG.VH - 10);
      ctx.fillStyle = 'rgba(207,214,228,0.55)';
      ctx.font = '13px ui-monospace,monospace';
      ctx.fillText('B = 0 on both paths — same k, phase only', 300, CFG.VH - 10);
    }

    function frame(t) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, CFG.VW, CFG.VH);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CFG.VW, CFG.VH);

      drawA();
      drawSolenoid();
      drawArm(armUp, t);
      drawArm(armDn, t);
      drawInputAndOutput(t);
      optic(CFG.xSplit, CFG.yAxis, thSplit);
      optic(CFG.xMirror, CFG.yAxis - CFG.armSep, thMirror);
      optic(CFG.xMirror, CFG.yAxis + CFG.armSep, thMirror);
      optic(CFG.xRecomb, CFG.yAxis, thRecomb);
      drawScreen();
      drawALabel();                   // last: the label can never be occluded
      drawText();
    }

    /* ---------- sizing (reveal.js scales slides with a CSS transform, so
       the backing store must follow clientWidth, not hardcoded pixels) --- */
    function resize() {
      var w = cv.clientWidth || root.clientWidth || CFG.VW;
      var d = window.devicePixelRatio || 1;
      if (w === cssW && d === dpr) return;
      cssW = w; dpr = d;
      cv.style.height = (w * CFG.VH / CFG.VW) + 'px';
      cv.width = Math.max(1, Math.round(w * d));
      cv.height = Math.max(1, Math.round(w * CFG.VH / CFG.VW * d));
      scale = cv.width / CFG.VW;
    }
    window.addEventListener('resize', resize);

    /* ---------- animation loop, paused when off screen ----------------- */
    var running = false, rafId = 0, t0 = -1;
    function loop(ts) {
      if (!running) return;
      if (t0 < 0) t0 = ts;                       // elapsed ms, not the raw
      resize();                                  // rAF timestamp (epoch-sized)
      for (var i = 0; i < CFG.dotsPerFrame; i++) addDot();
      frame(ts - t0);
      rafId = requestAnimationFrame(loop);
    }
    function start() { if (!running) { running = true; rafId = requestAnimationFrame(loop); } }
    function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) start(); else stop();
      }, { threshold: 0.01 }).observe(cv);
    } else { start(); }

    /* ---------- slider ------------------------------------------------- */
    function setPhi(v) {
      phiRatio = v;
      dPhi = TAU * v;
      buildCDF();
      resetDots();                 // resample immediately, do not age out
      readout.textContent = v.toFixed(3);
    }
    slider.addEventListener('input', function () { setPhi(parseFloat(slider.value)); });
    // reveal.js: keep arrow keys advancing slides, never the slider
    ['keydown', 'keyup', 'keypress'].forEach(function (ev) {
      slider.addEventListener(ev, function (e) { e.stopPropagation(); });
    });
    slider.addEventListener('mouseup', function () { slider.blur(); });
    slider.addEventListener('touchend', function () { slider.blur(); });
    slider.addEventListener('change', function () { slider.blur(); });

    resize();
    setPhi(0);
    start();
  } catch (e) { /* fail silently: never throw into the slide deck */ }
})();
</script>
<!-- END FRAGMENT -->
</div>
</body>
</html>

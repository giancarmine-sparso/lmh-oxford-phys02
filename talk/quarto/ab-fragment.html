<div id="ab-root" style="width:100%;max-width:1000px;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;">
  <canvas id="ab-canvas" style="display:block;width:100%;background:#000;border-radius:6px;"></canvas>
  <div id="ab-ctl" style="display:flex;align-items:center;gap:0.6em;margin-top:0.5em;color:#cfd6e4;font-size:0.55em;">
    <span style="white-space:nowrap;">&Phi;/&Phi;<sub>0</sub></span>
    <input id="ab-phi" type="range" min="0" max="1" step="0.005" value="0"
           style="flex:1 1 auto;accent-color:#ec9a40;cursor:pointer;">
    <span id="ab-phi-val" style="min-width:4.5em;text-align:right;color:#ec9a40;">0.000</span>
    <span style="display:inline-flex;gap:0.35em;margin-left:0.4em;">
      <button id="ab-p0"  style="font:inherit;color:#c9cfda;background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:0.1em 0.55em;cursor:pointer;">0</button>
      <button id="ab-p05" style="font:inherit;color:#c9cfda;background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:0.1em 0.55em;cursor:pointer;">&frac12;</button>
      <button id="ab-p1"  style="font:inherit;color:#c9cfda;background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:0.1em 0.55em;cursor:pointer;">1</button>
    </span>
    <span style="display:inline-flex;gap:0.35em;margin-left:0.8em;">
      <button id="ab-mode-collect" style="font:inherit;color:#c9cfda;background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:0.1em 0.55em;cursor:pointer;">collect</button>
      <button id="ab-mode-present" style="font:inherit;color:#c9cfda;background:#1a1d24;border:1px solid #3a3f4a;border-radius:4px;padding:0.1em 0.55em;cursor:pointer;">present</button>
    </span>
  </div>
</div>
<script>
(function () {
  'use strict';

  /* =====================================================================
     PHYSICS CONTRACT — do not "fix" these by eye. Visual tuning happens in
     CFG only; the four statements below are the content of the animation.

     (1) SAME WAVENUMBER IN BOTH ARMS.  B = 0 and E = 0 everywhere the
         electrons actually travel, so no force acts, momentum is unchanged
         and the de Broglie wavelength is IDENTICAL in the two arms.  Both
         arms are drawn with the one constant CFG.lambda / K below.  The
         upper arm must never look "tighter" than the lower one: that would
         depict an energy exchange that does not happen, and it is the most
         common way to get this figure wrong.  The only difference between
         the arms is a PHASE.

     (2) deltaPhi = 2*pi * Phi/Phi_0.  For display it is split symmetrically
         (symmetric gauge): the upper arm accumulates +deltaPhi/2 and the
         lower -deltaPhi/2, ramped linearly with arc length along the path.
         Only the value at recombination is gauge invariant / observable;
         the ramp is a gauge-dependent bookkeeping device, not a change of
         momentum -- which is exactly why K is still shared (see (1)).

     (3) VECTOR POTENTIAL.  Outside the solenoid A is purely azimuthal with
         |A| proportional to 1/r, and curl A = B = 0 there.  Arrowhead size
         and field-line opacity decay as 1/r DOWN TO legibility floors
         (aArrowMin, aOpMin): the decaying trend is the visual claim that
         |A| falls off, the floors keep the outer circles readable.  The
         circles MUST extend past the electron paths (aRmax well above the
         beam-line distance): A being nonzero AT the paths, where B is zero,
         is the entire content of the effect.

     (4) SCREEN INTENSITY.  I(y) = cos^2( pi*(y - yc)/S + deltaPhi/2 ).
         Maxima sit at y = yc + S*(m - Phi/Phi_0), so raising Phi by one
         flux quantum translates the pattern by exactly one fringe spacing.
         RIGID TRANSLATION: the envelope never changes shape or amplitude.
     ===================================================================== */

  var CFG = {
    // ---- virtual design space; every coordinate below lives in these units
    VW: 1000,            // design width  (canvas is scaled to fit its box)
    VH: 520,             // design height

    // ---- interferometer geometry -------------------------------------
    xSplit: 120,         // x of the beam splitter
    xMirror: 460,        // x of both mirrors (and of the solenoid)
    xRecomb: 800,        // x of the recombination splitter
    yAxis: 250,          // optical axis (y of splitter / recombiner)
    armSep: 150,         // vertical offset of each mirror from the axis
    xSource: 30,         // where the input beam starts
    opticLen: 46,        // length of the grey 45 deg optic rectangles
    opticThick: 7,       // thickness of the same

    // ---- the waves ----------------------------------------------------
    lambda: 34,          // DISPLAY wavelength, in design units. ONE value:
                         // both arms use it. See physics note (1).
    amp: 13,             // transverse amplitude of the drawn sine
    ds: 3,               // arc-length sampling step when stroking a wave
    waveSpeed: 0.5,      // wavelengths per second the crests travel (visual
                         // only; unrelated to the electron's real velocity).
                         // SAMPLING GUARD: the phase advance per frame is
                         // omega*16.7 ms and must stay well below pi, so keep
                         // waveSpeed under roughly 15 wavelengths/second.
                         // Above that the wave aliases -- it looks frantic and
                         // its apparent direction of travel is meaningless --
                         // no matter how reasonable the number looks here.
    waveDir: +1,         // +1: crests travel splitter -> screen. -1 reverses.
    pinchLen: 24,        // arc length over which the drawn amplitude fades to
                         // zero on either side of an optic. 0 disables the
                         // pinch entirely. Keep it well under lambda*1.5 or the
                         // beams look like they are being throttled.

    // ---- solenoid ------------------------------------------------------
    solR: 26,            // solenoid radius
    solDotPitch: 8.5,    // lattice pitch of the flux dots inside it
    solDotR: 1.9,        // radius of each flux dot

    // ---- vector potential field lines ---------------------------------
    aR0: 40,             // radius of the innermost A circle
    aGrow: 1.42,         // ratio between successive A circle radii
    aRmax: 340,          // largest A circle.  MUST comfortably exceed the
                         // closest beam-line distance from the solenoid
                         // (~137 for this geometry: armSep and the x's put
                         // the arm segments there), because A reaching the
                         // electron paths IS the Aharonov-Bohm point: the
                         // phase is picked up where A lives and B does not.
                         // 340 also spans the full recombiner distance, as
                         // in the reference frame; outer circles clip off
                         // the top/bottom of the canvas, which is fine.
    aRefR: 40,           // reference radius for the 1/r scaling
    aArrow: 11,          // arrowhead length at r = aRefR (scales as 1/r)
    aArrowMin: 4.5,      // legibility floor on arrowhead length.  The 1/r
                         // claim of physics note (3) is carried by OPACITY,
                         // which keeps decaying; below ~4 units an arrowhead
                         // no longer reads as a direction at all, which is
                         // worse than a slightly-too-big one.
    aOpacity: 0.95,      // opacity at r = aRefR (scales as 1/r)
    aOpMin: 0.45,        // legibility floor on circle/arrow opacity, BEFORE
                         // the slider factor.  Same trade as aArrowMin: the
                         // 1/r trend must stay readable as a trend, but an
                         // invisible outer circle claims "A is zero at the
                         // beams", which is precisely the wrong message.
    aSpin: 0.55,         // arrowhead drift, revolutions/s AT Phi/Phi_0 = 1 and
                         // r = aRefR.  Angular speed scales as phiRatio/r, so
                         // the whole field is frozen at Phi = 0 and inner
                         // circles visibly outrun outer ones -- both are the
                         // point: A "does something" only when flux is on,
                         // and |A| ~ 1/r.  Purely didactic motion, of course:
                         // a static A does not literally circulate.
    aFloor: 0.12,        // opacity multiplier at Phi = 0.  Nonzero so the
                         // geometry of the circles stays readable before the
                         // flux is turned up; the rest scales with phiRatio.

    // ---- look of the beams / optics -----------------------------------
    glowBlur: 12,        // shadowBlur of the halo pass under each beam
    glowAlpha: 0.42,     // opacity of that halo pass
    aGlowBlur: 6,        // shadowBlur of the halo under each A circle.
    aGlowAlpha: 0.3,     // ...and its opacity.  Deliberately LIGHTER than the
                         // beam glow: the circles are background, the beams
                         // are the subject.  Circles only -- the arrowheads
                         // are many small fills and glowing each one costs
                         // frame time for no visible gain.
    prismDepth: 26,      // beam-splitter trapezoid: extent along the axis
    prismHalfW: 30,      // ...half-height of its wide (entry) face
    prismTaper: 0.5,     // narrow face = prismTaper * wide face

    aLabelX: 970,        // RIGHT edge of the "B = nabla x A" formula
    aLabelY: 58,         // baseline of the glyphs; vec arrows sit above
    aLabelSize: 34,      // glyph size in px; the arrows scale with it

    // ---- detection screen ---------------------------------------------
    xScreen: 880,        // left edge of the accumulation band
    screenW: 46,         // width of the band the dots scatter across
    screenHalf: 170,     // half-height of the illuminated region
    fringeS: 34,         // fringe spacing S in eq. (4)
    refLead: 40,         // how far LEFT of the band the dashed reference
                         // maxima start.  Short ticks anchored to the screen:
                         // they are a ruler for the pattern, not part of the
                         // interferometer, so they must not reach back to the
                         // recombiner.
    maxDots: 2600,       // ring buffer size; oldest dots are recycled
    dotsPerFrame: 5,     // accumulation rate
    dotR: 1.5,           // dot radius
    profW: 30,           // horizontal extent of the continuous I(y) profile
                         // drawn just left of the band.  It is eq. (4) read
                         // out directly, so it moves the INSTANT the slider
                         // does; the dots then confirm it one electron at a
                         // time.  Its maxima kiss the dashed reference ticks
                         // at Phi = 0 and Phi = 1 -- that near-touch is the
                         // payoff, keep profW close to refLead minus a small
                         // gap.
    profGap: 4,          // gap between the profile's zero line and the band
    cdfBins: 512,        // resolution of the precomputed inverse CDF

    // ---- colours -------------------------------------------------------
    // Midway palette: livelier than pastel, but clipped short of full neon.
    cBeam: '#4be593',    // electron wave (vivid green, just shy of neon)
    cGuide: 'rgba(75,229,147,0.17)', // faint path guide under the wave
    cOptic: '#8c93a0',   // splitters and mirrors
    cSol: '#ec9a40',     // solenoid rim (warm amber)
    cSolFill: '#261a09', // solenoid interior
    cA: '#f4434e',       // vector potential (vivid red, just shy of neon)
    cARGB: '244,67,78',  // same colour as r,g,b -- for the rgba() strings
    cDot: 'rgba(150,240,185,0.92)', // screen dots
    cRef: 'rgba(155,195,255,0.85)', // dashed Phi = 0 reference maxima
    cText: '#c9cfda',
    cFormula: '#e6e9ef', // the white parts of "B = nabla x A"
    cPlate: '#5a6070'    // the screen plate itself
  };

  try {
    var root = document.getElementById('ab-root');
    var cv = document.getElementById('ab-canvas');
    var slider = document.getElementById('ab-phi');
    var readout = document.getElementById('ab-phi-val');
    if (!cv || !cv.getContext) return;              // fail silently
    var ctx = cv.getContext('2d');
    if (!ctx) return;

    var TAU = Math.PI * 2;
    var K = TAU / CFG.lambda;        // the ONE wavenumber -- physics note (1)
    // ONE angular frequency, in rad per millisecond, shared by the input beam,
    // both arms and the output beam.  Drawing time is ELAPSED ms (see loop()),
    // never the raw rAF timestamp.
    var OMEGA = TAU * CFG.waveSpeed / 1000;
    var phiRatio = 0;                // Phi / Phi_0
    var dPhi = 0;                    // deltaPhi = 2*pi*Phi/Phi_0
    var cssW = 0, dpr = 1, scale = 1;

    /* ---------- arm paths: splitter -> mirror -> recombiner ----------- */
    function makeArm(sign) {          // sign = -1 upper (smaller y), +1 lower
      var pts = [
        { x: CFG.xSplit,  y: CFG.yAxis },
        { x: CFG.xMirror, y: CFG.yAxis + sign * CFG.armSep },
        { x: CFG.xRecomb, y: CFG.yAxis }
      ];
      var cum = [0], total = 0, i;
      for (i = 1; i < pts.length; i++) {
        total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
        cum.push(total);
      }
      return { pts: pts, cum: cum, len: total, sign: sign };
    }
    var armUp = makeArm(-1), armDn = makeArm(1);

    function atArc(arm, s) {          // point + unit normal at arc length s
      var i = 1;
      while (i < arm.cum.length - 1 && s > arm.cum[i]) i++;
      var a = arm.pts[i - 1], b = arm.pts[i];
      var segL = arm.cum[i] - arm.cum[i - 1];
      var t = segL > 0 ? (s - arm.cum[i - 1]) / segL : 0;
      var dx = (b.x - a.x) / segL, dy = (b.y - a.y) / segL;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, nx: -dy, ny: dx };
    }

    /* ---------- inverse CDF of I(y), recomputed only when Phi moves ---- */
    var cdf = new Float64Array(CFG.cdfBins + 1);
    var y0 = CFG.yAxis - CFG.screenHalf, y1 = CFG.yAxis + CFG.screenHalf;

    function intensity(y) {           // physics note (4)
      var c = Math.cos(Math.PI * (y - CFG.yAxis) / CFG.fringeS + dPhi / 2);
      return c * c;
    }
    function buildCDF() {
      var acc = 0, i, y;
      cdf[0] = 0;
      for (i = 1; i <= CFG.cdfBins; i++) {
        y = y0 + (y1 - y0) * (i - 0.5) / CFG.cdfBins;
        acc += intensity(y);
        cdf[i] = acc;
      }
      for (i = 1; i <= CFG.cdfBins; i++) cdf[i] /= acc;
    }
    function sampleY() {              // inverse-CDF sampling, binary search
      var u = Math.random(), lo = 0, hi = CFG.cdfBins, mid;
      while (lo < hi) { mid = (lo + hi) >> 1; if (cdf[mid] < u) lo = mid + 1; else hi = mid; }
      return y0 + (y1 - y0) * (lo - Math.random()) / CFG.cdfBins;
    }

    /* ---------- dot ring buffer --------------------------------------- */
    var dx_ = new Float32Array(CFG.maxDots), dy_ = new Float32Array(CFG.maxDots);
    var dotN = 0, dotHead = 0;
    function addDot() {
      dx_[dotHead] = CFG.xScreen + Math.random() * CFG.screenW;
      dy_[dotHead] = sampleY();
      dotHead = (dotHead + 1) % CFG.maxDots;
      if (dotN < CFG.maxDots) dotN++;
    }
    function resetDots() { dotN = 0; dotHead = 0; }
    // On a Phi change, RESAMPLE the dots already on screen from the new I(y)
    // instead of wiping them: the pattern morphs instantly at full density,
    // with no dead seconds while the buffer refills.  Statistically honest --
    // each dot is an independent draw from the current distribution either
    // way; we just refuse to forget how many we had.  (Physically the frame
    // is a fiction regardless: the real experiment cannot re-place electrons
    // that already landed.  The alternative fiction -- an empty screen after
    // every nudge of the knob -- costs ~9 s of dead air each time and shows
    // nothing extra.  x positions are kept: they are decorative scatter.)
    function remapDots() { for (var i = 0; i < dotN; i++) dy_[i] = sampleY(); }
    function fillDots() {             // top the buffer up in one go
      for (var i = 0; i < CFG.maxDots; i++) {
        dx_[i] = CFG.xScreen + Math.random() * CFG.screenW;
        dy_[i] = sampleY();
      }
      dotN = CFG.maxDots; dotHead = 0;
    }

    /* ---------- display modes ------------------------------------------
       'present': the pattern is ALWAYS dense.  The buffer is filled on
         entry and remapped in place on every Phi change: slider drags feel
         instantaneous, zero dead air.  The stage default.
       'collect': every Phi change wipes the screen and the pattern rebuilds
         dot by dot at CFG.dotsPerFrame.  This trades ~9 s of waiting for
         the one thing 'present' cannot show: single electrons arriving at
         random, the statistics condensing into fringes before the
         audience's eyes.  Use it when THAT is the point being made.
       Both modes draw from the same I(y); they differ only in what happens
       to dots already on screen when Phi moves.                           */
    var mode = 'present';
    var btnCollect, btnPresent;
    function styleModeButtons() {
      if (!btnCollect || !btnPresent) return;
      var onB = '1px solid #ec9a40', offB = '1px solid #3a3f4a';
      btnCollect.style.border = mode === 'collect' ? onB : offB;
      btnCollect.style.color  = mode === 'collect' ? '#ec9a40' : '#c9cfda';
      btnPresent.style.border = mode === 'present' ? onB : offB;
      btnPresent.style.color  = mode === 'present' ? '#ec9a40' : '#c9cfda';
    }
    function setMode(m) {
      mode = m;
      if (m === 'present') fillDots(); else resetDots();
      styleModeButtons();
    }

    /* ---------- optic orientation, derived from the geometry -----------
       A reflecting surface must bisect the incoming and outgoing rays:
       reflection about a surface at angle th maps direction al -> 2*th - al,
       so th = (al_in + al_out)/2.  The arms leave the axis at the arm tilt,
       NOT at 45 degrees, so nothing here may be hardcoded -- change armSep or
       any of the x positions and the optics stay aligned.  (Canvas y grows
       downward; the two rhombus-vertex mirrors come out horizontal.)         */
    // (Splitter and recombiner are now prisms drawn by drawPrism; only the
    // mirrors still need an orientation, and by the bisection rule -- in
    // -tilt, out +tilt -- they come out horizontal for any armSep.)
    var thMirror = 0;

    /* ---------- beam envelope at the optics -----------------------------
       The drawn sine is pinched to zero wherever a beam meets an optic. Two
       things follow, both of them purely about the picture:
         - the stroke lands ON the reflecting face instead of poking out the
           back of the bar, which is what "the beams go through the mirrors"
           looks like;
         - at a mirror the path normal turns by twice the arm tilt, so a
           finite offset would jump from n_before to n_after in one sample and
           tear the wave open at exactly the vertex. Multiplying by an
           envelope that vanishes there makes the two limits agree at 0, so
           the curve closes up by construction and not by tuning.
       The envelope is a function of arc length ONLY. It is the SAME function
       in both arms, so it cannot smuggle in the arm-dependent wavelength that
       physics note (1) forbids: it scales amplitude, never K.               */
    function pinch(d) {               // 0 at the optic, 1 past CFG.pinchLen
      if (!(CFG.pinchLen > 0)) return 1;
      var u = d / CFG.pinchLen;
      if (u >= 1) return 1;
      if (u <= 0) return 0;
      return u * u * (3 - 2 * u);     // smoothstep: zero slope at both ends
    }
    function armEnv(arm, s) {         // splitter, mirror vertex, recombiner
      return pinch(s) * pinch(Math.abs(s - arm.cum[1])) * pinch(arm.len - s);
    }

    /* ================= drawing ======================================== */
    // face: shift of the bar along its OWN normal. A mirror reflects at its
    // front surface, so the bar is pushed half a thickness off the vertex and
    // the beam corner sits on the metal rather than inside it. Splitters are
    // transmissive and stay centred on the vertex (face omitted = 0).
    function optic(x, y, th, face) {  // grey bar, surface at angle th
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(th);
      ctx.fillStyle = CFG.cOptic;
      ctx.fillRect(-CFG.opticLen / 2, (face || 0) - CFG.opticThick / 2,
                   CFG.opticLen, CFG.opticThick);
      ctx.strokeStyle = 'rgba(228,232,239,0.78)';
      ctx.lineWidth = 1.4;
      ctx.strokeRect(-CFG.opticLen / 2, (face || 0) - CFG.opticThick / 2,
                     CFG.opticLen, CFG.opticThick);
      ctx.restore();
    }

    // Beam splitters as trapezoid prisms, wide face toward the incoming
    // beam.  dir = +1: wide face on the LEFT (input splitter); dir = -1:
    // mirrored, wide face on the RIGHT (recombiner).  The taper is drawing
    // vocabulary borrowed from optics diagrams, nothing quantitative.
    function drawPrism(x, y, dir) {
      var d = CFG.prismDepth / 2, w = CFG.prismHalfW, nw = w * CFG.prismTaper;
      ctx.beginPath();
      ctx.moveTo(x - dir * d, y - w);
      ctx.lineTo(x + dir * d, y - nw);
      ctx.lineTo(x + dir * d, y + nw);
      ctx.lineTo(x - dir * d, y + w);
      ctx.closePath();
      ctx.fillStyle = CFG.cOptic;
      ctx.fill();
      ctx.strokeStyle = 'rgba(228,232,239,0.78)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    // Two-pass stroke: a blurred wide halo underneath, then the crisp line.
    // Wrap the wave-path construction in a callback so both passes retrace
    // the identical geometry.
    function glowStroke(build) {
      ctx.save();
      ctx.strokeStyle = CFG.cBeam;
      ctx.globalAlpha = CFG.glowAlpha;
      ctx.lineWidth = 6;
      ctx.shadowColor = CFG.cBeam;
      ctx.shadowBlur = CFG.glowBlur;
      ctx.beginPath(); build(); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = CFG.cBeam;
      ctx.lineWidth = 2;
      ctx.beginPath(); build(); ctx.stroke();
    }

    function drawArm(arm, t) {
      var s, p, ph, off;
      ctx.strokeStyle = CFG.cGuide;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(arm.pts[0].x, arm.pts[0].y);
      for (var i = 1; i < arm.pts.length; i++) ctx.lineTo(arm.pts[i].x, arm.pts[i].y);
      ctx.stroke();

      glowStroke(function () {
        for (s = 0; s <= arm.len; s += CFG.ds) {
          p = atArc(arm, s);
          // gauge phase ramps linearly with arc length to +/- dPhi/2 -- note (2)
          ph = arm.sign < 0 ? +dPhi / 2 * (s / arm.len) : -dPhi / 2 * (s / arm.len);
          // SAME K and SAME OMEGA for both arms -- note (1)
          off = CFG.amp * armEnv(arm, s) * Math.sin(K * s - CFG.waveDir * OMEGA * t + ph);
          if (s === 0) ctx.moveTo(p.x + p.nx * off, p.y + p.ny * off);
          else ctx.lineTo(p.x + p.nx * off, p.y + p.ny * off);
        }
      });
    }

    function drawInputAndOutput(t) {
      var s, off, x;
      var lin = CFG.xSplit - CFG.xSource;   // input run-up length
      // Input beam: same K, same OMEGA, same waveDir.  Its arc length is
      // measured so that it reaches phase 0 exactly at the splitter, which is
      // where the arms start from 0 -- otherwise there is a kink at s = 0.
      glowStroke(function () {
        for (s = 0; s <= lin; s += CFG.ds) {
          off = CFG.amp * pinch(lin - s) * Math.sin(K * (s - lin) - CFG.waveDir * OMEGA * t);
          x = CFG.xSource + s;
          if (s === 0) ctx.moveTo(x, CFG.yAxis + off); else ctx.lineTo(x, CFG.yAxis + off);
        }
      });

      // Recombined axial ray: amplitude ~ |cos(deltaPhi/2)|, the on-axis value
      // of eq. (4).  Same K, OMEGA and waveDir -- interference, not a frequency
      // shift.  Its arc length continues from armUp.len, and the two arms'
      // gauge ramps are +/-dPhi/2 there, so the mean phase is continuous.
      var a = CFG.amp * Math.abs(Math.cos(dPhi / 2));
      glowStroke(function () {
        for (s = 0; s <= CFG.xScreen - CFG.xRecomb; s += CFG.ds) {
          off = a * pinch(s) * Math.sin(K * (armUp.len + s) - CFG.waveDir * OMEGA * t);
          x = CFG.xRecomb + s;
          if (s === 0) ctx.moveTo(x, CFG.yAxis + off); else ctx.lineTo(x, CFG.yAxis + off);
        }
      });
    }

    function drawSolenoid() {
      // A hex lattice of white dots: flux out of the plane, one dot per
      // "field line".  The lattice never changes with Phi -- the flux knob
      // is expressed by A (drawA) and by the fringes, not by adding dots.
      var cx = CFG.xMirror, cy = CFG.yAxis, row, col, x, y, rr;
      ctx.fillStyle = CFG.cSolFill;
      ctx.beginPath(); ctx.arc(cx, cy, CFG.solR, 0, TAU); ctx.fill();
      ctx.strokeStyle = CFG.cSol; ctx.lineWidth = 2.5; ctx.stroke();

      var pitch = CFG.solDotPitch, rows = Math.floor(CFG.solR / (pitch * 0.866));
      ctx.fillStyle = '#eef0f4';
      for (row = -rows; row <= rows; row++) {
        y = cy + row * pitch * 0.866;
        for (col = -rows - 1; col <= rows + 1; col++) {
          x = cx + (col + (row & 1 ? 0.5 : 0)) * pitch;
          rr = Math.hypot(x - cx, y - cy);
          if (rr <= CFG.solR - CFG.solDotR - 2.5) {
            ctx.beginPath(); ctx.arc(x, y, CFG.solDotR, 0, TAU); ctx.fill();
          }
        }
      }
    }

    function drawA(t) {
      var cx = CFG.xMirror, cy = CFG.yAxis, r, n, i, ang, op, len, spin;
      // Everything about the flux enters through phiRatio: brightness ramps
      // from aFloor to 1, and the arrowheads drift along their circles at a
      // rate ~ phiRatio/r.  Slider at 0: faint, frozen geometry.  Slider at
      // 1: full A, circulating.  The drift is a didactic cue, not physics --
      // see the note on CFG.aSpin.
      var lit = CFG.aFloor + (1 - CFG.aFloor) * phiRatio;
      for (r = CFG.aR0; r <= CFG.aRmax; r *= CFG.aGrow) {
        op = Math.max(CFG.aOpMin, Math.min(1, CFG.aOpacity * CFG.aRefR / r)) * lit;
        len = Math.max(CFG.aArrowMin, CFG.aArrow * CFG.aRefR / r);
        spin = TAU * CFG.aSpin * phiRatio * (CFG.aRefR / r) * t / 1000;
        ctx.strokeStyle = 'rgba(' + CFG.cARGB + ',' + op.toFixed(3) + ')';
        // light halo pass under the circle, then the crisp stroke
        ctx.save();
        ctx.globalAlpha = CFG.aGlowAlpha;
        ctx.lineWidth = 3.2;
        ctx.shadowColor = CFG.cA;
        ctx.shadowBlur = CFG.aGlowBlur;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();

        n = Math.max(6, Math.round(TAU * r / 62));
        ctx.fillStyle = 'rgba(' + CFG.cARGB + ',' + op.toFixed(3) + ')';
        for (i = 0; i < n; i++) {
          // SENSE OF CIRCULATION: the lattice dots declare B out of the
          // page, so the right-hand rule fixes A counterclockwise ON SCREEN.
          // This is not a style choice -- it is forced by the dots.  Canvas y
          // grows DOWNWARD, so screen-counterclockwise means the canvas angle
          // must DECREASE (hence "- spin") and the tangent is (sin, -cos),
          // the negative of the usual (-sin, cos).
          ang = TAU * i / n + 0.25 - spin;
          var px = cx + r * Math.cos(ang), py = cy + r * Math.sin(ang);
          var tx = Math.sin(ang), ty = -Math.cos(ang);     // ccw on screen
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(Math.atan2(ty, tx));
          ctx.beginPath();
          ctx.moveTo(len, 0); ctx.lineTo(-len * 0.55, len * 0.45);
          ctx.lineTo(-len * 0.55, -len * 0.45); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
    }

    // "B = nabla x A" label, top right, as in the reference frame: everything
    // white except A, which wears the colour of its field lines.  The vector
    // arrows over B and A are drawn by hand -- combining-arrow glyphs render
    // too unevenly across platforms to trust in a talk.  Full opacity: the
    // circles are attenuated by 1/r and by the slider, the label is not.
    // Drawn from frame() after everything else so it can never be occluded.
    function vecArrow(x, y, w, h) {   // small right arrow centred on (x, y)
      ctx.lineWidth = Math.max(1.5, h * 0.34);
      ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2 - h * 0.6, y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w / 2 - h, y - h * 0.6);
      ctx.lineTo(x + w / 2 - h, y + h * 0.6);
      ctx.closePath(); ctx.fill();
    }
    function drawALabel() {
      var y = CFG.aLabelY, sz = CFG.aLabelSize, x = CFG.aLabelX, w, i;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      var parts = [                      // glyph, colour, italic?, vec arrow?
        ['B', CFG.cFormula, true,  true ],
        [' = ', CFG.cFormula, false, false],
        ['\u2207', CFG.cFormula, false, false],
        [' \u00d7 ', CFG.cFormula, false, false],
        ['A', CFG.cA, true,  true ]
      ];
      // lay out right-aligned: measure total, then walk left to right
      var widths = [], total = 0;
      for (i = 0; i < parts.length; i++) {
        ctx.font = (parts[i][2] ? 'italic ' : '') + 'bold ' + sz + 'px ui-monospace,monospace';
        w = ctx.measureText(parts[i][0]).width;
        widths.push(w); total += w;
      }
      x = CFG.aLabelX - total;           // aLabelX is now the RIGHT edge
      for (i = 0; i < parts.length; i++) {
        ctx.font = (parts[i][2] ? 'italic ' : '') + 'bold ' + sz + 'px ui-monospace,monospace';
        ctx.fillStyle = parts[i][1]; ctx.strokeStyle = parts[i][1];
        ctx.fillText(parts[i][0], x, y);
        if (parts[i][3]) vecArrow(x + widths[i] / 2, y - sz * 0.92, widths[i] * 0.9, sz * 0.16);
        x += widths[i];
      }
    }

    function drawScreen() {
      var i, m, y;
      ctx.fillStyle = CFG.cPlate;
      ctx.fillRect(CFG.xScreen + CFG.screenW, CFG.yAxis - CFG.screenHalf - 14, 5,
                   2 * CFG.screenHalf + 28);
      // dashed reference lines: maxima of the Phi = 0 pattern
      ctx.strokeStyle = CFG.cRef; ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 6]);
      for (m = -Math.floor(CFG.screenHalf / CFG.fringeS); m <= Math.floor(CFG.screenHalf / CFG.fringeS); m++) {
        y = CFG.yAxis + m * CFG.fringeS;
        ctx.beginPath();
        ctx.moveTo(CFG.xScreen - CFG.refLead, y); ctx.lineTo(CFG.xScreen + CFG.screenW, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // continuous I(y): the theory curve the dots are sampling.  Baseline at
      // xScreen - profGap, bulging LEFT by profW * I(y).  Faint fill + line.
      var xb = CFG.xScreen - CFG.profGap, yy;
      ctx.beginPath();
      ctx.moveTo(xb, y0);
      for (yy = y0; yy <= y1; yy += 2) ctx.lineTo(xb - CFG.profW * intensity(yy), yy);
      ctx.lineTo(xb, y1);
      ctx.closePath();
      ctx.fillStyle = 'rgba(75,229,147,0.10)';
      ctx.fill();
      ctx.beginPath();
      for (yy = y0; yy <= y1; yy += 2) {
        var xc = xb - CFG.profW * intensity(yy);
        if (yy === y0) ctx.moveTo(xc, yy); else ctx.lineTo(xc, yy);
      }
      ctx.strokeStyle = 'rgba(75,229,147,0.85)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.fillStyle = CFG.cDot;
      for (i = 0; i < dotN; i++) {
        ctx.beginPath(); ctx.arc(dx_[i], dy_[i], CFG.dotR, 0, TAU); ctx.fill();
      }
    }

    function drawText() {
      ctx.fillStyle = CFG.cText;
      ctx.font = '15px ui-monospace,monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('Φ/Φ₀ = ' + phiRatio.toFixed(3), 30, CFG.VH - 54);
      ctx.fillText('Δφ  = ' + (dPhi / Math.PI).toFixed(3) + ' π', 30, CFG.VH - 32);
      ctx.fillText('shift = ' + phiRatio.toFixed(3) + ' fringe' + (Math.abs(phiRatio - 1) < 5e-4 ? '' : 's'),
                   30, CFG.VH - 10);
      ctx.fillStyle = 'rgba(207,214,228,0.55)';
      ctx.font = '13px ui-monospace,monospace';
      ctx.fillText('B = 0 on both paths — same k, phase only', 300, CFG.VH - 10);
    }

    function frame(t) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, CFG.VW, CFG.VH);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CFG.VW, CFG.VH);

      drawA(t);
      drawSolenoid();
      drawArm(armUp, t);
      drawArm(armDn, t);
      drawInputAndOutput(t);
      drawPrism(CFG.xSplit, CFG.yAxis, +1);
      optic(CFG.xMirror, CFG.yAxis - CFG.armSep, thMirror, -CFG.opticThick / 2);
      optic(CFG.xMirror, CFG.yAxis + CFG.armSep, thMirror, +CFG.opticThick / 2);
      drawPrism(CFG.xRecomb, CFG.yAxis, -1);
      drawScreen();
      drawALabel();                   // last: the label can never be occluded
      drawText();
    }

    /* ---------- sizing (reveal.js scales slides with a CSS transform, so
       the backing store must follow clientWidth, not hardcoded pixels) --- */
    function resize() {
      var w = cv.clientWidth || root.clientWidth || CFG.VW;
      var d = window.devicePixelRatio || 1;
      if (w === cssW && d === dpr) return;
      cssW = w; dpr = d;
      cv.style.height = (w * CFG.VH / CFG.VW) + 'px';
      cv.width = Math.max(1, Math.round(w * d));
      cv.height = Math.max(1, Math.round(w * CFG.VH / CFG.VW * d));
      scale = cv.width / CFG.VW;
    }
    window.addEventListener('resize', resize);

    /* ---------- animation loop, paused when off screen ----------------- */
    var running = false, rafId = 0, t0 = -1;
    function loop(ts) {
      if (!running) return;
      if (t0 < 0) t0 = ts;                       // elapsed ms, not the raw
      resize();                                  // rAF timestamp (epoch-sized)
      for (var i = 0; i < CFG.dotsPerFrame; i++) addDot();
      frame(ts - t0);
      rafId = requestAnimationFrame(loop);
    }
    function start() { if (!running) { running = true; rafId = requestAnimationFrame(loop); } }
    function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) start(); else stop();
      }, { threshold: 0.01 }).observe(cv);
    } else { start(); }

    /* ---------- slider ------------------------------------------------- */
    function setPhi(v) {
      phiRatio = v;
      dPhi = TAU * v;
      buildCDF();
      if (mode === 'present') remapDots();  // morph in place, no dead air
      else resetDots();                     // wipe: watch the pattern build
      readout.textContent = v.toFixed(3);
    }
    slider.addEventListener('input', function () { setPhi(parseFloat(slider.value)); });
    // Preset buttons: land EXACTLY on 0, 1/2, 1 -- the three values the talk
    // lives on -- without trackpad drama.  blur() keeps reveal.js arrow keys
    // driving slides, not the last-clicked button.
    [['ab-p0', 0], ['ab-p05', 0.5], ['ab-p1', 1]].forEach(function (pv) {
      var b = document.getElementById(pv[0]);
      if (!b) return;
      b.addEventListener('click', function () {
        slider.value = String(pv[1]);
        setPhi(pv[1]);
        b.blur();
      });
    });
    // reveal.js: keep arrow keys advancing slides, never the slider
    ['keydown', 'keyup', 'keypress'].forEach(function (ev) {
      slider.addEventListener(ev, function (e) { e.stopPropagation(); });
    });
    slider.addEventListener('mouseup', function () { slider.blur(); });
    slider.addEventListener('touchend', function () { slider.blur(); });
    slider.addEventListener('change', function () { slider.blur(); });

    // Mode buttons: same blur() discipline as the presets.
    btnCollect = document.getElementById('ab-mode-collect');
    btnPresent = document.getElementById('ab-mode-present');
    if (btnCollect) btnCollect.addEventListener('click', function () { setMode('collect'); btnCollect.blur(); });
    if (btnPresent) btnPresent.addEventListener('click', function () { setMode('present'); btnPresent.blur(); });

    resize();
    setPhi(0);
    setMode('present');            // stage default: dense from the first frame
    start();
  } catch (e) { /* fail silently: never throw into the slide deck */ }
})();
</script>

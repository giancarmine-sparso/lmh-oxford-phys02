project:
  type: default
  output-dir: dist
  render:
    - index.qmd

lang: en

format:
  revealjs:
    theme:
      - default
      - theme.scss

    width: 1600
    height: 900
    margin: 0.04
    center: false

    navigation-mode: linear
    controls: false
    progress: false
    slide-number: "c/t"

    transition: fade
    background-transition: fade

bibliography: ../references/references.bib

nocite: |
  @rundel2026ironfilings

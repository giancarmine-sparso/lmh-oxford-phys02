project:
  type: default
  output-dir: dist
  render:
    - index.qmd

lang: en

format:
  revealjs:
    embed-resources: true
    self-contained-math: true
    html-math-method: mathml

    theme:
      - default
      - theme.scss

    width: 1600
    height: 900
    margin: 0.04
    center: false

    navigation-mode: linear
    controls: false
    progress: false
    slide-number: "c/t"

    show-notes: false
    pdf-separate-fragments: false
    pdf-max-pages-per-slide: 1

    transition: fade
    background-transition: fade

bibliography: ../references/references.bib

nocite: '@*'

[project]
name = "atlas-analysis"
version = "0.1.0"
description = "Data-selection, transverse-mass and ABCD workflows for the PHYS02 poster."
readme = "README.md"
license = "MIT"
authors = [{ name = "Giancarmine Sparso" }]
requires-python = ">=3.14"
dependencies = [
    "awkward>=2.12.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scienceplots>=2.2.2",
    "uproot>=5.7.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/giancarmine-sparso/lmh-oxford-phys02"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
